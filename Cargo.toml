[package]
name = "rs-jsonl2redb"
version = "0.1.0"
edition = "2024"

description = "Import JSONL data into a redb database"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-jsonl2redb"
homepage = "https://github.com/takanoriyanagitani/rs-jsonl2redb"
documentation = "https://docs.rs/rs-jsonl2redb/latest"
keywords = ["json", "redb", "jsonl", "import", "convert"]

exclude = [
  "jsonl2redb.wasm",
]

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "jsonl2redb"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[dependencies.serde_json]
version = "1.0.151"
default-features = false
features = [
  "std",
]

[dependencies.redb]
version = "4.3.0"
default-features = false
features = [
  "std",
]
